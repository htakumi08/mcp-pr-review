[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-mcp"
version = "0.1.0"
description = "Read-only Backlog MCP server for PR review context"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
